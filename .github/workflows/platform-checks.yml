name: platform checks

on:
  pull_request:
    paths:
      - .github/workflows/platform-checks.yml
      - .dockerignore
      - compose.yaml
      - infra/docker/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - migrations/**
      - shared/**
      - apps/web/**
      - python/**
      - data/demo/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --no-build
      - run: |
          curl --retry 12 --retry-all-errors --retry-delay 2 --max-time 5 -fsS http://127.0.0.1:3000/
          curl --retry 12 --retry-all-errors --retry-delay 2 --max-time 5 -fsS http://127.0.0.1:3000/api/pp/demo/healthz
          curl --retry 12 --retry-all-errors --retry-delay 2 --max-time 5 -fsS 'http://127.0.0.1:3000/api/pp/demo/api/v1/tasks?limit=1'
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
  macos-core:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project python --python 3.11 --locked
      - run: uv run --project python --python 3.11 --locked pytest -q python/tests
      - run: cargo test --locked --workspace
