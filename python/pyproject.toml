[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panelproof"
version = "0.1.0"
description = "PanelProof: synthetic pump-panel visual benchmark generator, verifier and evaluator"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.1,<13",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<6",
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
panelproof = "panelproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
