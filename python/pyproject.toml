[project]
name = "panelproof"
version = "0.1.0"
description = "Synthetic visual evaluation of fictional pump panels"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "pillow>=11.3,<13",
    "pydantic==2.13.5",
    "pyyaml>=6.0.2,<7",
    "referencing>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panelproof"]

[tool.hatch.build.targets.wheel.force-include]
"../shared/units.json" = "panelproof/units.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
