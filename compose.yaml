# Optional. Offline demo: API on the committed data/demo bundle plus the web UI. No credentials, no network at run time.
#   docker compose up --build        then open http://127.0.0.1:3000
# The Task Factory (generation jobs) needs Python and the Rust binary inside the web container and is not wired here.
services:
  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["/data/demo", "/tmp/panelproof-demo.sqlite", "127.0.0.1:3001"]
    environment:
      PANELPROOF_REVEAL_TOKEN: ${PANELPROOF_REVEAL_TOKEN:-local-dev-token-0123}
    volumes:
      - ./data/demo:/data/demo:ro
    # The web process shares this network namespace and listens on port 3000.
    ports: ["127.0.0.1:3000:3000"]
  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    network_mode: "service:api"
    environment:
      PP_API_DEMO: http://127.0.0.1:3001
      PANELPROOF_REVEAL_TOKEN: ${PANELPROOF_REVEAL_TOKEN:-local-dev-token-0123}
      PP_DEMO_DIR: /data/demo
    volumes:
      - ./data/demo:/data/demo:ro
    depends_on: [api]
